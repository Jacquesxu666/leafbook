name: Validate inherited website (deployment disabled)

# LeafBook does not yet have a project-owned website or Cloudflare Worker.
# This workflow intentionally performs read-only validation only. Re-enable
# deployment after a LeafBook-owned target, credentials, and public identity
# have been reviewed; never deploy this fork to the inherited upstream target.

on:
  push:
    branches: [develop]
    paths:
      - 'packages/website/**'
      - 'packages/muyajs/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/website-deploy.yml'
  pull_request:
    paths:
      - 'packages/website/**'
      - 'packages/muyajs/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/website-deploy.yml'

concurrency:
  group: website-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.21.1'
          cache: 'pnpm'
      - name: Install desktop-rebuild system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxkbfile-dev libsecret-1-dev
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint inherited documentation
        run: pnpm --filter leafbook-docs-validation run lint
      - name: Type-check inherited documentation
        run: pnpm --filter leafbook-docs-validation run type-check
      - name: Build inherited documentation without publishing
        run: pnpm --filter leafbook-docs-validation run build
