name: Release LeafBook

on:
  push:
    # Broad trigger so the validate job can reject malformed v-tags
    # (e.g. `vbad.tag`) instead of them silently not triggering anything.
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      is_prerelease: ${{ steps.release-metadata.outputs.is_prerelease }}
    steps:
      - name: Check out Git repository
        # actions/checkout v4.3.1
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      # The repository setup action installs with --frozen-lockfile and
      # --ignore-scripts, matching the normal PR validation workflows.
      - name: Setup pnpm + Node + frozen dependencies
        uses: ./.github/actions/setup
        with:
          node-version: '24.14.1'

      - name: Validate tag against desktop package version
        id: release-metadata
        run: node scripts/validate-release-tag.mjs "${GITHUB_REF_NAME}"

      - name: Verify LeafBook generated metadata
        run: pnpm verify-leafbook-metadata

      - name: Verify Windows association policy
        run: pnpm verify-windows-associations

      - name: Validate dependency licenses
        run: pnpm validate-licenses

      - name: Gate formal release notes
        run: pnpm verify:release-notes

      - name: Bind SBOM time to exact source commit
        shell: bash
        run: |
          source_date_epoch="$(git show -s --format=%ct "${GITHUB_SHA}^{commit}")"
          [[ "$source_date_epoch" =~ ^[1-9][0-9]*$ ]]
          printf 'SOURCE_DATE_EPOCH=%s\n' "$source_date_epoch" >> "$GITHUB_ENV"

      - name: Generate transitive SPDX release SBOM
        run: |
          mkdir -p release-evidence
          pnpm generate:release-sbom -- release-evidence/leafbook.spdx.json
          cp docs/RELEASE_NOTES.md release-evidence/RELEASE_NOTES.md
          node scripts/release-checksums.mjs \
            write release-evidence METADATA_SHA256SUMS.txt
          node scripts/release-checksums.mjs \
            verify release-evidence METADATA_SHA256SUMS.txt

      - name: Upload release metadata
        # actions/upload-artifact v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: leafbook-release-metadata
          retention-days: 7
          if-no-files-found: error
          path: |
            release-evidence/METADATA_SHA256SUMS.txt
            release-evidence/RELEASE_NOTES.md
            release-evidence/leafbook.spdx.json

      - name: Regenerate and verify third-party notices
        run: |
          pnpm gen-third-party
          git diff --exit-code -- packages/desktop/build/THIRD-PARTY-LICENSES.txt

      - name: Run ESLint
        run: pnpm lint

      - name: Run TypeScript typecheck
        run: pnpm typecheck

      - name: Run Muya TypeScript typecheck
        run: pnpm -C packages/muya lint:types

      - name: Run desktop unit tests
        run: pnpm test:unit

      - name: Run complete Muya unit suite
        run: pnpm -C packages/muya test

      - name: Build desktop application
        run: pnpm build

  electron-e2e:
    name: Electron E2E gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out Git repository
        # actions/checkout v4.3.1
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxkbfile-dev libsecret-1-dev libfontconfig-dev \
            xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libdrm2 libgtk-3-0 libgbm1 libasound2t64

      - name: Setup pnpm + Node + frozen dependencies
        uses: ./.github/actions/setup
        with:
          node-version: '24.14.1'

      # Match the normal Electron E2E workflow: rebuild native modules and
      # prepare locales before building and launching under Xvfb.
      - name: Run postinstall
        run: pnpm tsx scripts/postinstall.ts
        env:
          npm_config_user_agent: 'pnpm'
          USE_ELECTRON_CLANG: '0'

      - name: Build app
        run: pnpm build

      - name: Run Electron E2E tests
        run: xvfb-run --auto-servernum pnpm test:e2e

  windows-native-evidence:
    name: Build and validate signed Windows evidence
    needs:
      - quality-gate
      - electron-e2e
    uses: ./.github/workflows/windows-signed-evidence.yml
    with:
      expected-commit: ${{ github.sha }}
      expected-signer-thumbprint: ${{ vars.WIN_SIGNER_SHA1 }}

  linux-native-evidence:
    name: Build and validate Linux evidence
    needs:
      - quality-gate
      - electron-e2e
    uses: ./.github/workflows/platform-evidence.yml
    with:
      expected-commit: ${{ github.sha }}

  macos-x64-native-evidence:
    name: Build and validate signed macOS x64 evidence
    needs:
      - quality-gate
      - electron-e2e
    uses: ./.github/workflows/macos-signed-evidence.yml
    with:
      architecture: x64
      expected-commit: ${{ github.sha }}

  macos-arm64-native-evidence:
    name: Build and validate signed macOS arm64 evidence
    needs:
      - quality-gate
      - electron-e2e
    uses: ./.github/workflows/macos-signed-evidence.yml
    with:
      architecture: arm64
      expected-commit: ${{ github.sha }}

  assemble-release:
    name: Assemble read-only release candidate
    needs:
      - quality-gate
      - electron-e2e
      - windows-native-evidence
      - linux-native-evidence
      - macos-x64-native-evidence
      - macos-arm64-native-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      IS_PRERELEASE: ${{ needs.quality-gate.outputs.is_prerelease }}
    steps:
      - name: Check out Git repository
        # actions/checkout v4.3.1
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      # Keep the build-carrier allowlist explicit. This must not use an
      # unbounded pattern or merge every artifact from the run: the quality
      # gate also uploads SBOM/release-note evidence, which is not part of the
      # exact 16-carrier release asset contract.
      - name: Download Linux x64 native candidate
        # actions/download-artifact v4.3.0
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: leafbook-linux-x64-native-candidate
          path: native/linux-x64

      - name: Download Linux x64 native receipt
        # actions/download-artifact v4.3.0
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: leafbook-linux-x64-native-receipt
          path: native-receipts/linux-x64

      - name: Download Linux arm64 native candidate
        # actions/download-artifact v4.3.0
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: leafbook-linux-arm64-native-candidate
          path: native/linux-arm64

      - name: Download Linux arm64 native receipt
        # actions/download-artifact v4.3.0
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: leafbook-linux-arm64-native-receipt
          path: native-receipts/linux-arm64

      - name: Download Windows x64 signed native candidate
        # actions/download-artifact v4.3.0
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: leafbook-windows-x64-signed-candidate
          path: native/windows-x64

      - name: Download Windows x64 native receipt
        # actions/download-artifact v4.3.0
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: leafbook-windows-x64-native-receipt
          path: native-receipts/windows-x64

      - name: Download Windows arm64 signed native candidate
        # actions/download-artifact v4.3.0
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: leafbook-windows-arm64-signed-candidate
          path: native/windows-arm64

      - name: Download Windows arm64 native receipt
        # actions/download-artifact v4.3.0
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: leafbook-windows-arm64-native-receipt
          path: native-receipts/windows-arm64

      - name: Download macOS x64 signed native candidate
        # actions/download-artifact v4.3.0
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: leafbook-macos-x64-signed-candidate
          path: native/macos-x64

      - name: Download macOS x64 native receipt
        # actions/download-artifact v4.3.0
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: leafbook-macos-x64-native-receipt
          path: native-receipts/macos-x64

      - name: Download macOS arm64 signed native candidate
        # actions/download-artifact v4.3.0
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: leafbook-macos-arm64-signed-candidate
          path: native/macos-arm64

      - name: Download macOS arm64 native receipt
        # actions/download-artifact v4.3.0
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: leafbook-macos-arm64-native-receipt
          path: native-receipts/macos-arm64

      - name: Verify and stage only receipt-bound native carrier bytes
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./packages/desktop/package.json').version")"
          mkdir dist
          verify_receipt() {
            local platform="$1" architecture="$2" carriers="$3" receipt="$4"
            node - "$receipt" "$platform" "$architecture" "$GITHUB_REF_NAME" "$GITHUB_SHA" <<'NODE'
          const fs = require('node:fs')
          const [file, platform, architecture, tag, commit] = process.argv.slice(2)
          const receipt = JSON.parse(fs.readFileSync(file, 'utf8'))
          if (receipt.schema !== 'leafbook-native-evidence-v2' || receipt.platform !== platform ||
              receipt.architecture !== architecture || receipt.tag !== tag || receipt.commit !== commit) {
            throw new Error('Native receipt does not bind the release tag, commit, platform, and architecture')
          }
          NODE
            node scripts/native-evidence-receipt.mjs verify --receipt "$receipt" --carriers "$carriers"
          }
          verify_receipt linux x64 native/linux-x64 \
            native-receipts/linux-x64/leafbook-linux-x64-native-evidence.json
          verify_receipt linux arm64 native/linux-arm64 \
            native-receipts/linux-arm64/leafbook-linux-arm64-native-evidence.json
          verify_receipt windows x64 native/windows-x64 \
            native-receipts/windows-x64/leafbook-windows-x64-native-evidence.json
          verify_receipt windows arm64 native/windows-arm64 \
            native-receipts/windows-arm64/leafbook-windows-arm64-native-evidence.json
          verify_macos_receipt() {
            local architecture="$1" carriers="$2" receipt="$3"
            node - "$receipt" "$architecture" "$GITHUB_REF_NAME" "$GITHUB_SHA" <<'NODE'
          const fs = require('node:fs')
          const [file, architecture, tag, commit] = process.argv.slice(2)
          const receipt = JSON.parse(fs.readFileSync(file, 'utf8'))
          if (receipt.schema !== 'leafbook-macos-native-evidence-v1' ||
              receipt.platform !== 'macos' || receipt.architecture !== architecture ||
              receipt.tag !== tag || receipt.commit !== commit) {
            throw new Error('macOS receipt does not bind the release tag, commit, and architecture')
          }
          NODE
            node scripts/macos-native-evidence.mjs verify \
              --receipt "$receipt" --carriers "$carriers"
          }
          verify_macos_receipt x64 native/macos-x64 \
            native-receipts/macos-x64/leafbook-macos-x64-native-evidence.json
          verify_macos_receipt arm64 native/macos-arm64 \
            native-receipts/macos-arm64/leafbook-macos-arm64-native-evidence.json
          for architecture in x64 arm64; do
            for extension in AppImage deb rpm tar.gz; do
              cp "native/linux-$architecture/leafbook-linux-$architecture-$version.$extension" dist/
            done
            cp "native/windows-$architecture/leafbook-win-$architecture-$version-setup.exe" dist/
            cp "native/windows-$architecture/leafbook-win-$architecture-$version.zip" dist/
            cp "native/macos-$architecture/leafbook-mac-$architecture-$version.dmg" dist/
            cp "native/macos-$architecture/leafbook-mac-$architecture-$version.zip" dist/
          done

      - name: Download exact release metadata
        # actions/download-artifact v4.3.0
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: leafbook-release-metadata
          path: release-metadata

      - name: Verify exact release metadata and formal notes
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release-checksums.mjs \
            verify release-metadata METADATA_SHA256SUMS.txt
          python3 - <<'PY'
          import os
          import stat

          root = 'release-metadata'
          expected = {
              'METADATA_SHA256SUMS.txt',
              'RELEASE_NOTES.md',
              'leafbook.spdx.json',
          }
          root_stat = os.lstat(root)
          if not stat.S_ISDIR(root_stat.st_mode) or stat.S_ISLNK(root_stat.st_mode):
              raise SystemExit('Unsafe release metadata root')
          actual = set(os.listdir(root))
          if actual != expected:
              raise SystemExit('Unexpected release metadata set')
          for name in expected:
              item = os.lstat(os.path.join(root, name))
              if not stat.S_ISREG(item.st_mode) or item.st_nlink != 1:
                  raise SystemExit('Unsafe release metadata file: ' + name)
              if item.st_size <= 0 or item.st_size > 1024 * 1024 * 1024:
                  raise SystemExit('Invalid release metadata size: ' + name)
          PY
          cmp docs/RELEASE_NOTES.md release-metadata/RELEASE_NOTES.md
          node scripts/verify-release-notes.mjs release-metadata/RELEASE_NOTES.md

      - name: Verify server tag target before release assembly
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/verify-release-preconditions.mjs

      - name: Reject updater metadata from release assets
        run: bash scripts/audit-release-files.sh dist

      - name: Generate SHA256SUMS.txt
        run: |
          node scripts/release-checksums.mjs write dist
          node scripts/release-checksums.mjs verify dist

      - name: Compose draft body from verified formal notes
        env:
          IS_PRERELEASE: ${{ needs.quality-gate.outputs.is_prerelease }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          channel = os.environ.get('IS_PRERELEASE')
          if channel not in {'true', 'false'}:
              raise SystemExit('Invalid release channel')
          notes = Path('release-metadata/RELEASE_NOTES.md').read_bytes()
          banner = b'## Pre-release candidate\n\nThis draft is not approved for public release.\n\n'
          Path('release_body.md').write_bytes((banner if channel == 'true' else b'') + notes)
          PY

      - name: Reverify metadata and composed draft body
        env:
          IS_PRERELEASE: ${{ needs.quality-gate.outputs.is_prerelease }}
        run: |
          node scripts/release-checksums.mjs \
            verify release-metadata METADATA_SHA256SUMS.txt
          node scripts/verify-release-notes.mjs release-metadata/RELEASE_NOTES.md
          cmp docs/RELEASE_NOTES.md release-metadata/RELEASE_NOTES.md
          python3 - <<'PY'
          import os
          from pathlib import Path

          channel = os.environ.get('IS_PRERELEASE')
          if channel not in {'true', 'false'}:
              raise SystemExit('Invalid release channel')
          notes = Path('release-metadata/RELEASE_NOTES.md').read_bytes()
          banner = b'## Pre-release candidate\n\nThis draft is not approved for public release.\n\n'
          expected = (banner if channel == 'true' else b'') + notes
          if Path('release_body.md').read_bytes() != expected:
              raise SystemExit('Draft body does not exactly contain the verified formal notes')
          PY

      - name: Upload assembled candidate
        # actions/upload-artifact v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: leafbook-release-candidate
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/*
            release_body.md
            release-metadata/METADATA_SHA256SUMS.txt
            release-metadata/RELEASE_NOTES.md
            release-metadata/leafbook.spdx.json

  supply-chain-evidence:
    name: Attest receipt-bound release candidate
    needs: assemble-release
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/supply-chain-evidence.yml
    with:
      candidate-artifact-name: leafbook-release-candidate

  create-release:
    name: Create GitHub draft release
    needs:
      - quality-gate
      - assemble-release
      - supply-chain-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download assembled candidate
        # actions/download-artifact v4.3.0
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: leafbook-release-candidate
          path: candidate

      - name: Verify downloaded candidate checksums
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          import re
          import stat

          tag = os.environ.get('GITHUB_REF_NAME', '')
          match = re.fullmatch(
              r'v((?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)'
              r'(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?'
              r'(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?)',
              tag,
          )
          if not match:
              raise SystemExit('Release tag is not canonical SemVer')
          version = match.group(1)
          expected_subjects = {
              f'leafbook-linux-x64-{version}.AppImage',
              f'leafbook-linux-x64-{version}.deb',
              f'leafbook-linux-x64-{version}.rpm',
              f'leafbook-linux-x64-{version}.tar.gz',
              f'leafbook-linux-arm64-{version}.AppImage',
              f'leafbook-linux-arm64-{version}.deb',
              f'leafbook-linux-arm64-{version}.rpm',
              f'leafbook-linux-arm64-{version}.tar.gz',
              f'leafbook-win-x64-{version}-setup.exe',
              f'leafbook-win-x64-{version}.zip',
              f'leafbook-win-arm64-{version}-setup.exe',
              f'leafbook-win-arm64-{version}.zip',
              f'leafbook-mac-x64-{version}.dmg',
              f'leafbook-mac-x64-{version}.zip',
              f'leafbook-mac-arm64-{version}.dmg',
              f'leafbook-mac-arm64-{version}.zip',
          }
          if len(expected_subjects) != 16:
              raise SystemExit('Internal release subject policy is invalid')
          carrier_limits = {}
          for name in expected_subjects:
              if name.endswith('.dmg'):
                  carrier_limits[name] = 768 * 1024 * 1024
              elif name.endswith(('.zip', '.tar.gz')):
                  carrier_limits[name] = 640 * 1024 * 1024
              else:
                  carrier_limits[name] = 512 * 1024 * 1024
          snapshot_root = 'final-release'
          snapshot_assets = os.path.join(snapshot_root, 'assets')
          os.mkdir(snapshot_root, 0o700)
          os.mkdir(snapshot_assets, 0o700)
          root = 'candidate/dist'
          manifest_name = 'SHA256SUMS.txt'
          manifest_path = os.path.join(root, manifest_name)
          root_before = os.lstat(root)
          if not stat.S_ISDIR(root_before.st_mode) or stat.S_ISLNK(root_before.st_mode):
              raise SystemExit('Unsafe release subject root')
          manifest_stat = os.lstat(manifest_path)
          if (
              not stat.S_ISREG(manifest_stat.st_mode)
              or stat.S_ISLNK(manifest_stat.st_mode)
              or manifest_stat.st_nlink != 1
              or manifest_stat.st_size <= 0
              or manifest_stat.st_size > 16 * 1024 * 1024
          ):
              raise SystemExit('Unsafe checksum manifest')
          flags = os.O_RDONLY | getattr(os, 'O_NOFOLLOW', 0)
          destination_flags = os.O_CREAT | os.O_EXCL | os.O_WRONLY
          def write_all(descriptor, contents):
              offset = 0
              while offset < len(contents):
                  written = os.write(descriptor, contents[offset:])
                  if written <= 0:
                      raise SystemExit('Snapshot write made no progress')
                  offset += written

          def suspicious_sparse(item):
              blocks = getattr(item, 'st_blocks', None)
              return item.st_size >= 1024 * 1024 and blocks is not None and blocks * 512 < item.st_size // 2

          snapshot_manifest_path = os.path.join(snapshot_assets, manifest_name)
          snapshot_manifest = os.open(snapshot_manifest_path, destination_flags, 0o400)
          descriptor = os.open(manifest_path, flags)
          manifest_chunks = []
          manifest_total = 0
          try:
              opened = os.fstat(descriptor)
              manifest_before_identity = (
                  manifest_stat.st_dev, manifest_stat.st_ino, manifest_stat.st_mode,
                  manifest_stat.st_nlink, manifest_stat.st_size,
                  manifest_stat.st_mtime_ns, manifest_stat.st_ctime_ns,
              )
              manifest_opened_identity = (
                  opened.st_dev, opened.st_ino, opened.st_mode, opened.st_nlink, opened.st_size,
                  opened.st_mtime_ns, opened.st_ctime_ns,
              )
              if manifest_opened_identity != manifest_before_identity:
                  raise SystemExit('Checksum manifest identity changed')
              while True:
                  chunk = os.read(descriptor, 1024 * 1024)
                  if not chunk:
                      break
                  manifest_total += len(chunk)
                  if manifest_total > opened.st_size or manifest_total > 16 * 1024 * 1024:
                      raise SystemExit('Checksum manifest exceeds audited size')
                  write_all(snapshot_manifest, chunk)
                  manifest_chunks.append(chunk)
              os.fsync(snapshot_manifest)
              manifest_after = os.fstat(descriptor)
          finally:
              os.close(descriptor)
              os.close(snapshot_manifest)
          if manifest_total != opened.st_size:
              raise SystemExit('Checksum manifest size changed while reading')
          manifest = b''.join(manifest_chunks)
          manifest_final = os.lstat(manifest_path)
          manifest_identity = (
              opened.st_dev, opened.st_ino, opened.st_mode, opened.st_nlink, opened.st_size,
              opened.st_mtime_ns, opened.st_ctime_ns
          )
          if manifest_identity != (
              manifest_after.st_dev, manifest_after.st_ino, manifest_after.st_mode,
              manifest_after.st_nlink, manifest_after.st_size,
              manifest_after.st_mtime_ns, manifest_after.st_ctime_ns
          ) or manifest_identity != (
              manifest_final.st_dev, manifest_final.st_ino, manifest_final.st_mode,
              manifest_final.st_nlink, manifest_final.st_size,
              manifest_final.st_mtime_ns, manifest_final.st_ctime_ns
          ):
              raise SystemExit('Checksum manifest changed while reading')
          snapshot_manifest_stat = os.lstat(snapshot_manifest_path)
          if (
              not stat.S_ISREG(snapshot_manifest_stat.st_mode)
              or snapshot_manifest_stat.st_nlink != 1
              or snapshot_manifest_stat.st_size != manifest_total
          ):
              raise SystemExit('Unsafe snapshot checksum manifest')
          lines = manifest.decode('utf-8').splitlines()
          pattern = re.compile(r'^([0-9a-f]{64})  ([A-Za-z0-9][A-Za-z0-9._+-]*)$')
          declared = {}
          for line in lines:
              match = pattern.fullmatch(line)
              if not match or match.group(2) in declared:
                  raise SystemExit('Malformed or duplicate checksum entry')
              declared[match.group(2)] = match.group(1)
          if set(declared) != expected_subjects:
              raise SystemExit('Checksum manifest does not declare the exact 16 release subjects')
          actual = set()
          with os.scandir(root) as entries:
              for entry in entries:
                  if entry.name == manifest_name:
                      continue
                  if not entry.is_file(follow_symlinks=False) or entry.is_symlink():
                      raise SystemExit('Unsafe non-regular release subject')
                  actual.add(entry.name)
          if actual != expected_subjects:
              raise SystemExit('Release directory does not contain the exact 16 release subjects')
          source_identities = {}
          for name in sorted(actual, key=os.fsencode):
              subject_path = os.path.join(root, name)
              before = os.lstat(subject_path)
              carrier_limit = carrier_limits[name]
              if (
                  not stat.S_ISREG(before.st_mode)
                  or stat.S_ISLNK(before.st_mode)
                  or before.st_nlink != 1
                  or before.st_size <= 0
                  or before.st_size > carrier_limit
                  or suspicious_sparse(before)
              ):
                  raise SystemExit('Unsafe release subject: ' + name)
              snapshot_path = os.path.join(snapshot_assets, name)
              snapshot = os.open(snapshot_path, destination_flags, 0o400)
              subject = os.open(subject_path, flags)
              digest = hashlib.sha256()
              total = 0
              try:
                  opened = os.fstat(subject)
                  before_identity = (
                      before.st_dev, before.st_ino, before.st_mode, before.st_nlink,
                      before.st_size, before.st_mtime_ns, before.st_ctime_ns,
                  )
                  opened_identity = (
                      opened.st_dev, opened.st_ino, opened.st_mode, opened.st_nlink,
                      opened.st_size, opened.st_mtime_ns, opened.st_ctime_ns,
                  )
                  if opened_identity != before_identity:
                      raise SystemExit('Release subject identity changed: ' + name)
                  while chunk := os.read(subject, 1024 * 1024):
                      total += len(chunk)
                      if total > opened.st_size or total > carrier_limit:
                          raise SystemExit('Release subject exceeded audited size: ' + name)
                      digest.update(chunk)
                      write_all(snapshot, chunk)
                  os.fsync(snapshot)
                  after = os.fstat(subject)
              finally:
                  os.close(subject)
                  os.close(snapshot)
              final = os.lstat(subject_path)
              identity = (
                  opened.st_dev, opened.st_ino, opened.st_mode, opened.st_nlink, opened.st_size,
                  opened.st_mtime_ns, opened.st_ctime_ns
              )
              if total != opened.st_size or identity != (
                  after.st_dev, after.st_ino, after.st_mode, after.st_nlink, after.st_size,
                  after.st_mtime_ns, after.st_ctime_ns
              ) or identity != (
                  final.st_dev, final.st_ino, final.st_mode, final.st_nlink, final.st_size,
                  final.st_mtime_ns, final.st_ctime_ns
              ):
                  raise SystemExit('Release subject changed while hashing: ' + name)
              if digest.hexdigest() != declared[name]:
                  raise SystemExit('Checksum mismatch: ' + name)
              source_identities[name] = identity
              snapshot_stat = os.lstat(snapshot_path)
              if (
                  not stat.S_ISREG(snapshot_stat.st_mode)
                  or snapshot_stat.st_nlink != 1
                  or snapshot_stat.st_size != total
                  or suspicious_sparse(snapshot_stat)
              ):
                  raise SystemExit('Unsafe snapshot release subject: ' + name)
              snapshot_descriptor = os.open(snapshot_path, flags)
              snapshot_digest = hashlib.sha256()
              snapshot_total = 0
              try:
                  snapshot_opened = os.fstat(snapshot_descriptor)
                  while chunk := os.read(snapshot_descriptor, 1024 * 1024):
                      snapshot_total += len(chunk)
                      if snapshot_total > snapshot_opened.st_size or snapshot_total > carrier_limit:
                          raise SystemExit('Snapshot subject exceeded audited size: ' + name)
                      snapshot_digest.update(chunk)
                  snapshot_after = os.fstat(snapshot_descriptor)
              finally:
                  os.close(snapshot_descriptor)
              snapshot_final = os.lstat(snapshot_path)
              snapshot_identity = (
                  snapshot_opened.st_dev, snapshot_opened.st_ino, snapshot_opened.st_mode,
                  snapshot_opened.st_nlink, snapshot_opened.st_size,
                  snapshot_opened.st_mtime_ns, snapshot_opened.st_ctime_ns,
              )
              if snapshot_identity != (
                  snapshot_after.st_dev, snapshot_after.st_ino, snapshot_after.st_mode,
                  snapshot_after.st_nlink, snapshot_after.st_size,
                  snapshot_after.st_mtime_ns, snapshot_after.st_ctime_ns,
              ) or snapshot_identity != (
                  snapshot_final.st_dev, snapshot_final.st_ino, snapshot_final.st_mode,
                  snapshot_final.st_nlink, snapshot_final.st_size,
                  snapshot_final.st_mtime_ns, snapshot_final.st_ctime_ns,
              ) or snapshot_total != total or snapshot_digest.hexdigest() != declared[name]:
                  raise SystemExit('Snapshot subject copy mismatch: ' + name)
          final_actual = set()
          with os.scandir(root) as entries:
              for entry in entries:
                  if entry.name == manifest_name:
                      continue
                  if not entry.is_file(follow_symlinks=False) or entry.is_symlink():
                      raise SystemExit('Unsafe final release subject')
                  final_actual.add(entry.name)
          if final_actual != actual:
              raise SystemExit('Checksum subject set changed while hashing')
          for name, expected_identity in source_identities.items():
              late = os.lstat(os.path.join(root, name))
              if expected_identity != (
                  late.st_dev, late.st_ino, late.st_mode, late.st_nlink, late.st_size,
                  late.st_mtime_ns, late.st_ctime_ns,
              ):
                  raise SystemExit('Release subject changed after snapshot copy: ' + name)
          manifest_late = os.lstat(manifest_path)
          if manifest_identity != (
              manifest_late.st_dev, manifest_late.st_ino, manifest_late.st_mode,
              manifest_late.st_nlink, manifest_late.st_size,
              manifest_late.st_mtime_ns, manifest_late.st_ctime_ns,
          ):
              raise SystemExit('Checksum manifest changed after subject verification')
          root_after = os.lstat(root)
          root_identity = (
              root_before.st_dev, root_before.st_ino, root_before.st_mode, root_before.st_nlink,
              root_before.st_mtime_ns, root_before.st_ctime_ns
          )
          if root_identity != (
              root_after.st_dev, root_after.st_ino, root_after.st_mode, root_after.st_nlink,
              root_after.st_mtime_ns, root_after.st_ctime_ns
          ):
              raise SystemExit('Release subject directory changed while hashing')
          if set(os.listdir(snapshot_assets)) != expected_subjects | {manifest_name}:
              raise SystemExit('Snapshot release asset set mismatch')
          os.chmod(snapshot_assets, 0o500)
          print(f'Verified {len(actual)} exact release subjects.')
          PY

      - name: Reverify exact metadata and formal draft notes
        id: final-snapshot
        shell: bash
        env:
          IS_PRERELEASE: ${{ needs.quality-gate.outputs.is_prerelease }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import secrets
          import stat

          metadata_root = 'candidate/release-metadata'
          snapshot_root = 'final-release'
          snapshot_assets = os.path.join(snapshot_root, 'assets')
          snapshot_evidence = os.path.join(snapshot_root, 'evidence')
          snapshot_root_stat = os.lstat(snapshot_root)
          if not stat.S_ISDIR(snapshot_root_stat.st_mode) or stat.S_ISLNK(snapshot_root_stat.st_mode):
              raise SystemExit('Unsafe final snapshot root')
          os.mkdir(snapshot_evidence, 0o700)
          expected_subjects = {'RELEASE_NOTES.md', 'leafbook.spdx.json'}
          expected_files = expected_subjects | {'METADATA_SHA256SUMS.txt'}
          root_before = os.lstat(metadata_root)
          if not stat.S_ISDIR(root_before.st_mode) or stat.S_ISLNK(root_before.st_mode):
              raise SystemExit('Unsafe release metadata root')
          if set(os.listdir(metadata_root)) != expected_files:
              raise SystemExit('Unexpected release metadata set')

          flags = os.O_RDONLY | getattr(os, 'O_NOFOLLOW', 0)
          destination_flags = os.O_CREAT | os.O_EXCL | os.O_WRONLY
          def write_all(descriptor, contents):
              offset = 0
              while offset < len(contents):
                  written = os.write(descriptor, contents[offset:])
                  if written <= 0:
                      raise SystemExit('Snapshot metadata write made no progress')
                  offset += written

          def suspicious_sparse(item):
              blocks = getattr(item, 'st_blocks', None)
              return item.st_size >= 1024 * 1024 and blocks is not None and blocks * 512 < item.st_size // 2

          def stable_read(path, maximum, destination=None):
              before = os.lstat(path)
              if (
                  not stat.S_ISREG(before.st_mode)
                  or stat.S_ISLNK(before.st_mode)
                  or before.st_nlink != 1
                  or before.st_size <= 0
                  or before.st_size > maximum
                  or suspicious_sparse(before)
              ):
                  raise SystemExit('Unsafe metadata file: ' + path)
              descriptor = os.open(path, flags)
              snapshot = (
                  os.open(destination, destination_flags, 0o400)
                  if destination is not None
                  else None
              )
              chunks = []
              total = 0
              try:
                  opened = os.fstat(descriptor)
                  before_identity = (
                      before.st_dev, before.st_ino, before.st_mode, before.st_nlink,
                      before.st_size, before.st_mtime_ns, before.st_ctime_ns,
                  )
                  opened_identity = (
                      opened.st_dev, opened.st_ino, opened.st_mode, opened.st_nlink,
                      opened.st_size, opened.st_mtime_ns, opened.st_ctime_ns,
                  )
                  if opened_identity != before_identity:
                      raise SystemExit('Metadata identity changed: ' + path)
                  while True:
                      chunk = os.read(descriptor, 1024 * 1024)
                      if not chunk:
                          break
                      total += len(chunk)
                      if total > opened.st_size or total > maximum:
                          raise SystemExit('Metadata exceeded audited size: ' + path)
                      if snapshot is not None:
                          write_all(snapshot, chunk)
                      chunks.append(chunk)
                  if snapshot is not None:
                      os.fsync(snapshot)
                  after = os.fstat(descriptor)
              finally:
                  os.close(descriptor)
                  if snapshot is not None:
                      os.close(snapshot)
              final = os.lstat(path)
              identity = (
                  opened.st_dev, opened.st_ino, opened.st_mode, opened.st_nlink,
                  opened.st_size, opened.st_mtime_ns, opened.st_ctime_ns,
              )
              if identity != (
                  after.st_dev, after.st_ino, after.st_mode, after.st_nlink,
                  after.st_size, after.st_mtime_ns, after.st_ctime_ns,
              ) or identity != (
                  final.st_dev, final.st_ino, final.st_mode, final.st_nlink,
                  final.st_size, final.st_mtime_ns, final.st_ctime_ns,
              ) or total != opened.st_size:
                  raise SystemExit('Metadata changed while reading: ' + path)
              contents = b''.join(chunks)
              if destination is not None:
                  copied = os.lstat(destination)
                  if (
                      not stat.S_ISREG(copied.st_mode)
                      or copied.st_nlink != 1
                      or copied.st_size != total
                      or suspicious_sparse(copied)
                  ):
                      raise SystemExit('Unsafe snapshot metadata copy: ' + destination)
              return contents

          manifest = stable_read(
              os.path.join(metadata_root, 'METADATA_SHA256SUMS.txt'),
              16 * 1024 * 1024,
              os.path.join(snapshot_evidence, 'METADATA_SHA256SUMS.txt'),
          ).decode('utf-8')
          declared = {}
          pattern = re.compile(r'^([0-9a-f]{64})  ([A-Za-z0-9][A-Za-z0-9._+-]*)$')
          for line in manifest.splitlines():
              match = pattern.fullmatch(line)
              if not match or match.group(2) in declared:
                  raise SystemExit('Malformed metadata checksum entry')
              declared[match.group(2)] = match.group(1)
          if set(declared) != expected_subjects:
              raise SystemExit('Metadata checksum set mismatch')
          notes = stable_read(
              os.path.join(metadata_root, 'RELEASE_NOTES.md'),
              128 * 1024,
              os.path.join(snapshot_evidence, 'RELEASE_NOTES.md'),
          )
          sbom = stable_read(
              os.path.join(metadata_root, 'leafbook.spdx.json'),
              16 * 1024 * 1024,
              os.path.join(snapshot_evidence, 'leafbook.spdx.json'),
          )
          for name, contents in [('RELEASE_NOTES.md', notes), ('leafbook.spdx.json', sbom)]:
              if hashlib.sha256(contents).hexdigest() != declared[name]:
                  raise SystemExit('Metadata checksum mismatch: ' + name)

          channel = os.environ.get('IS_PRERELEASE')
          if channel not in {'true', 'false'}:
              raise SystemExit('Invalid release channel')
          banner = b'## Pre-release candidate\n\nThis draft is not approved for public release.\n\n'
          expected_body = (banner if channel == 'true' else b'') + notes
          body = stable_read(
              'candidate/release_body.md',
              256 * 1024,
              os.path.join(snapshot_root, 'release_body.md'),
          )
          if body != expected_body:
              raise SystemExit('Draft body is not the exact verified formal release notes')

          root_after = os.lstat(metadata_root)
          root_identity = (
              root_before.st_dev, root_before.st_ino, root_before.st_mode,
              root_before.st_nlink, root_before.st_mtime_ns, root_before.st_ctime_ns,
          )
          if root_identity != (
              root_after.st_dev, root_after.st_ino, root_after.st_mode,
              root_after.st_nlink, root_after.st_mtime_ns, root_after.st_ctime_ns,
          ):
              raise SystemExit('Release metadata root changed during verification')

          tag = os.environ.get('GITHUB_REF_NAME', '')
          version_match = re.fullmatch(
              r'v((?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)'
              r'(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?'
              r'(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?)',
              tag,
          )
          if not version_match:
              raise SystemExit('Release tag is not canonical SemVer')
          version = version_match.group(1)
          commit = os.environ.get('GITHUB_SHA', '')
          if not re.fullmatch(r'[0-9a-f]{40}', commit):
              raise SystemExit('Release commit binding is invalid')
          expected_carriers = {
              f'leafbook-linux-x64-{version}.AppImage',
              f'leafbook-linux-x64-{version}.deb',
              f'leafbook-linux-x64-{version}.rpm',
              f'leafbook-linux-x64-{version}.tar.gz',
              f'leafbook-linux-arm64-{version}.AppImage',
              f'leafbook-linux-arm64-{version}.deb',
              f'leafbook-linux-arm64-{version}.rpm',
              f'leafbook-linux-arm64-{version}.tar.gz',
              f'leafbook-win-x64-{version}-setup.exe',
              f'leafbook-win-x64-{version}.zip',
              f'leafbook-win-arm64-{version}-setup.exe',
              f'leafbook-win-arm64-{version}.zip',
              f'leafbook-mac-x64-{version}.dmg',
              f'leafbook-mac-x64-{version}.zip',
              f'leafbook-mac-arm64-{version}.dmg',
              f'leafbook-mac-arm64-{version}.zip',
          }
          if set(os.listdir(snapshot_assets)) != expected_carriers | {'SHA256SUMS.txt'}:
              raise SystemExit('Final snapshot asset set mismatch')
          if set(os.listdir(snapshot_evidence)) != expected_files:
              raise SystemExit('Final snapshot evidence set mismatch')

          file_limits = {
              'release_body.md': 256 * 1024,
              'evidence/METADATA_SHA256SUMS.txt': 16 * 1024 * 1024,
              'evidence/RELEASE_NOTES.md': 128 * 1024,
              'evidence/leafbook.spdx.json': 16 * 1024 * 1024,
              'assets/SHA256SUMS.txt': 16 * 1024 * 1024,
          }
          for name in expected_carriers:
              if name.endswith('.dmg'):
                  file_limits['assets/' + name] = 768 * 1024 * 1024
              elif name.endswith(('.zip', '.tar.gz')):
                  file_limits['assets/' + name] = 640 * 1024 * 1024
              else:
                  file_limits['assets/' + name] = 512 * 1024 * 1024

          def stable_record(relative, maximum):
              item_path = os.path.join(snapshot_root, relative)
              before = os.lstat(item_path)
              if (
                  not stat.S_ISREG(before.st_mode)
                  or stat.S_ISLNK(before.st_mode)
                  or before.st_nlink != 1
                  or before.st_size <= 0
                  or before.st_size > maximum
                  or suspicious_sparse(before)
              ):
                  raise SystemExit('Unsafe final snapshot file: ' + relative)
