                      raise SystemExit('Final snapshot state exceeded audited size')
                  state_digest.update(chunk)
              state_after = os.fstat(state_reader)
          finally:
              os.close(state_reader)
          state_final = os.lstat(state_path)
          state_identity = (
              state_opened.st_dev, state_opened.st_ino, state_opened.st_mode,
              state_opened.st_nlink, state_opened.st_size,
              state_opened.st_mtime_ns, state_opened.st_ctime_ns,
          )
          if state_identity != (
              state_before.st_dev, state_before.st_ino, state_before.st_mode,
              state_before.st_nlink, state_before.st_size,
              state_before.st_mtime_ns, state_before.st_ctime_ns,
          ) or state_identity != (
              state_after.st_dev, state_after.st_ino, state_after.st_mode,
              state_after.st_nlink, state_after.st_size,
              state_after.st_mtime_ns, state_after.st_ctime_ns,
          ) or state_identity != (
