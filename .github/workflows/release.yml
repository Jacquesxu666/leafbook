                  ('state_sha256=' + state_digest.hexdigest() + '\n').encode(),
              )
              os.fsync(output_descriptor)
          finally:
              os.close(output_descriptor)
          print('Verified exact release metadata and formal draft notes.')
          PY

      # Every channel reaches this step only after receipt-bound signed Windows,
      # signed/notarized macOS, and native Linux carrier evidence succeeds. This
      # workflow creates a draft only; publication remains a separate manual act.
      - name: Create draft release with assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_STATE_SHA256: ${{ steps.final-snapshot.outputs.state_sha256 }}
          IS_PRERELEASE: ${{ needs.quality-gate.outputs.is_prerelease }}
        run: |
          python3 - <<'PY'
          import hashlib
          import hmac
          import json
          import os
          import re
          import stat

          snapshot_root = 'final-release'
          state_path = 'final-release-state.json'
          flags = os.O_RDONLY | getattr(os, 'O_NOFOLLOW', 0)

          def identity(item):
              return [
                  item.st_dev, item.st_ino, item.st_mode, item.st_nlink,
                  item.st_size, item.st_mtime_ns, item.st_ctime_ns,
              ]

          def directory_identity(item):
              return [
                  item.st_dev, item.st_ino, item.st_mode, item.st_nlink,
                  item.st_mtime_ns, item.st_ctime_ns,
              ]

          def suspicious_sparse(item):
              blocks = getattr(item, 'st_blocks', None)
              return item.st_size >= 1024 * 1024 and blocks is not None and blocks * 512 < item.st_size // 2

          state_before = os.lstat(state_path)
          if (
              not stat.S_ISREG(state_before.st_mode)
              or state_before.st_nlink != 1
              or state_before.st_size <= 0
              or state_before.st_size > 1024 * 1024
          ):
              raise SystemExit('Unsafe final snapshot state')
          state_descriptor = os.open(state_path, flags)
          try:
              state_opened = os.fstat(state_descriptor)
              state_bytes = os.read(state_descriptor, 1024 * 1024 + 1)
              if len(state_bytes) > 1024 * 1024 or os.read(state_descriptor, 1):
                  raise SystemExit('Final snapshot state exceeds 1 MiB')
              state_after = os.fstat(state_descriptor)
          finally:
              os.close(state_descriptor)
          state_final = os.lstat(state_path)
          if (
              identity(state_before) != identity(state_opened)
              or identity(state_opened) != identity(state_after)
              or identity(state_opened) != identity(state_final)
          ):
              raise SystemExit('Final snapshot state changed while reading')
          expected_state_digest = os.environ.get('EXPECTED_STATE_SHA256', '')
          actual_state_digest = hashlib.sha256(state_bytes).hexdigest()
          if (
              not re.fullmatch(r'[0-9a-f]{64}', expected_state_digest)
              or not hmac.compare_digest(actual_state_digest, expected_state_digest)
          ):
              raise SystemExit('Final snapshot state does not match the trusted step output')
          state = json.loads(state_bytes)
          if (
              state.get('schema') != 1
              or state.get('tag') != os.environ.get('GITHUB_REF_NAME')
              or state.get('commit') != os.environ.get('GITHUB_SHA')
              or not re.fullmatch(r'[0-9a-f]{64}', state.get('nonce', ''))
          ):
              raise SystemExit('Unsupported final snapshot state')

          tag = os.environ.get('GITHUB_REF_NAME', '')
          version_match = re.fullmatch(
              r'v((?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)'
              r'(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?'
              r'(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?)',
              tag,
          )
          if not version_match:
              raise SystemExit('Release tag is not canonical SemVer')
          version = version_match.group(1)
          expected_carriers = {
              f'leafbook-linux-x64-{version}.AppImage',
              f'leafbook-linux-x64-{version}.deb',
              f'leafbook-linux-x64-{version}.rpm',
              f'leafbook-linux-x64-{version}.tar.gz',
              f'leafbook-linux-arm64-{version}.AppImage',
              f'leafbook-linux-arm64-{version}.deb',
              f'leafbook-linux-arm64-{version}.rpm',
              f'leafbook-linux-arm64-{version}.tar.gz',
              f'leafbook-win-x64-{version}-setup.exe',
              f'leafbook-win-x64-{version}.zip',
              f'leafbook-win-arm64-{version}-setup.exe',
              f'leafbook-win-arm64-{version}.zip',
              f'leafbook-mac-x64-{version}.dmg',
              f'leafbook-mac-x64-{version}.zip',
              f'leafbook-mac-arm64-{version}.dmg',
              f'leafbook-mac-arm64-{version}.zip',
          }
          expected_paths = {
              'release_body.md',
              'evidence/METADATA_SHA256SUMS.txt',
              'evidence/RELEASE_NOTES.md',
              'evidence/leafbook.spdx.json',
              'assets/SHA256SUMS.txt',
          } | {'assets/' + name for name in expected_carriers}
          if set(os.listdir(snapshot_root)) != {'assets', 'evidence', 'release_body.md'}:
              raise SystemExit('Final snapshot root set mismatch')
          if set(os.listdir(os.path.join(snapshot_root, 'assets'))) != expected_carriers | {
              'SHA256SUMS.txt'
          }:
              raise SystemExit('Final snapshot asset set mismatch')
          if set(os.listdir(os.path.join(snapshot_root, 'evidence'))) != {
              'METADATA_SHA256SUMS.txt',
              'RELEASE_NOTES.md',
              'leafbook.spdx.json',
          }:
              raise SystemExit('Final snapshot evidence set mismatch')
          records = state.get('files')
          if (
              not isinstance(records, list)
              or {record.get('path') for record in records if isinstance(record, dict)} != expected_paths
              or len(records) != len(expected_paths)
          ):
              raise SystemExit('Final snapshot file policy mismatch')

          limits = {
              'release_body.md': 256 * 1024,
              'evidence/METADATA_SHA256SUMS.txt': 16 * 1024 * 1024,
              'evidence/RELEASE_NOTES.md': 128 * 1024,
              'evidence/leafbook.spdx.json': 16 * 1024 * 1024,
              'assets/SHA256SUMS.txt': 16 * 1024 * 1024,
          }
          for name in expected_carriers:
              if name.endswith('.dmg'):
                  limits['assets/' + name] = 768 * 1024 * 1024
              elif name.endswith(('.zip', '.tar.gz')):
                  limits['assets/' + name] = 640 * 1024 * 1024
              else:
                  limits['assets/' + name] = 512 * 1024 * 1024

          captured_paths = {
              'release_body.md',
              'assets/SHA256SUMS.txt',
              'evidence/METADATA_SHA256SUMS.txt',
              'evidence/RELEASE_NOTES.md',
          }
          verified_digests = {}
          verified_contents = {}
          for record in records:
              relative = record['path']
              item_path = os.path.join(snapshot_root, relative)
              before = os.lstat(item_path)
              maximum = limits[relative]
              if (
                  not stat.S_ISREG(before.st_mode)
                  or stat.S_ISLNK(before.st_mode)
                  or before.st_nlink != 1
                  or before.st_size <= 0
                  or before.st_size > maximum
                  or suspicious_sparse(before)
                  or identity(before) != record.get('identity')
              ):
                  raise SystemExit('Final snapshot identity mismatch: ' + relative)
              descriptor = os.open(item_path, flags)
              digest = hashlib.sha256()
              chunks = []
              total = 0
              try:
                  opened = os.fstat(descriptor)
                  if identity(opened) != identity(before):
                      raise SystemExit('Final snapshot changed before hashing: ' + relative)
                  while chunk := os.read(descriptor, 1024 * 1024):
                      total += len(chunk)
                      if total > opened.st_size or total > maximum:
                          raise SystemExit('Final snapshot exceeded audited size: ' + relative)
                      digest.update(chunk)
                      if relative in captured_paths:
                          chunks.append(chunk)
                  after = os.fstat(descriptor)
              finally:
                  os.close(descriptor)
              final = os.lstat(item_path)
              actual_digest = digest.hexdigest()
              if (
                  total != opened.st_size
                  or identity(opened) != identity(after)
                  or identity(opened) != identity(final)
                  or actual_digest != record.get('sha256')
              ):
                  raise SystemExit('Final snapshot digest changed: ' + relative)
              verified_digests[relative] = actual_digest
              if relative in captured_paths:
                  verified_contents[relative] = b''.join(chunks)

          checksum_pattern = re.compile(
              rb'^([0-9a-f]{64})  ([A-Za-z0-9][A-Za-z0-9._+-]*)$'
          )
          carrier_manifest = {}
          for line in verified_contents['assets/SHA256SUMS.txt'].splitlines():
              match = checksum_pattern.fullmatch(line)
              if not match or match.group(2).decode() in carrier_manifest:
                  raise SystemExit('Malformed final carrier checksum manifest')
              carrier_manifest[match.group(2).decode()] = match.group(1).decode()
          if set(carrier_manifest) != expected_carriers:
              raise SystemExit('Final carrier manifest is not the exact 16 subjects')
          for name, expected_digest in carrier_manifest.items():
              if not hmac.compare_digest(verified_digests['assets/' + name], expected_digest):
                  raise SystemExit('Final carrier manifest digest mismatch: ' + name)

          metadata_manifest = {}
          for line in verified_contents['evidence/METADATA_SHA256SUMS.txt'].splitlines():
              match = checksum_pattern.fullmatch(line)
              if not match or match.group(2).decode() in metadata_manifest:
                  raise SystemExit('Malformed final metadata checksum manifest')
              metadata_manifest[match.group(2).decode()] = match.group(1).decode()
          if set(metadata_manifest) != {'RELEASE_NOTES.md', 'leafbook.spdx.json'}:
              raise SystemExit('Final metadata manifest is not the exact two subjects')
          for name, expected_digest in metadata_manifest.items():
              if not hmac.compare_digest(
                  verified_digests['evidence/' + name],
                  expected_digest,
              ):
                  raise SystemExit('Final metadata manifest digest mismatch: ' + name)

          channel = os.environ.get('IS_PRERELEASE')
          if channel not in {'true', 'false'}:
              raise SystemExit('Invalid final release channel')
          banner = b'## Pre-release candidate\n\nThis draft is not approved for public release.\n\n'
          expected_body = (
              (banner if channel == 'true' else b'')
              + verified_contents['evidence/RELEASE_NOTES.md']
          )
          if not hmac.compare_digest(
              verified_contents['release_body.md'],
              expected_body,
          ):
              raise SystemExit('Final draft body does not equal verified formal notes')

          directories = state.get('directories')
          if (
              not isinstance(directories, list)
              or len(directories) != 3
              or any(not isinstance(record, dict) for record in directories)
              or {record.get('path') for record in directories} != {'', 'assets', 'evidence'}
          ):
              raise SystemExit('Final snapshot directory policy mismatch')
          for record in directories:
              relative = record.get('path')
              if relative not in {'', 'assets', 'evidence'}:
                  raise SystemExit('Unexpected final snapshot directory')
              directory_path = os.path.join(snapshot_root, relative)
              directory = os.lstat(directory_path)
              if (
                  not stat.S_ISDIR(directory.st_mode)
                  or stat.S_ISLNK(directory.st_mode)
                  or directory_identity(directory) != record.get('identity')
                  or sorted(os.listdir(directory_path), key=os.fsencode) != record.get('entries')
              ):
                  raise SystemExit(
                      'Final snapshot directory changed: '
                      + relative
                      + ' expected='
                      + repr(record)
                      + ' actual_identity='
                      + repr(directory_identity(directory))
                  )
          print('Final release snapshot fully reverified immediately before upload.')
          PY

          # Fixed remote preflight immediately before the repository write.
          # Tag protection is still required for the unavoidable API
          # check/create micro-window.
          set -euo pipefail
          repository="${GITHUB_REPOSITORY:?}"
          tag="${GITHUB_REF_NAME:?}"
          expected="${GITHUB_SHA:?}"
          [[ "$repository" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "$tag" =~ ^v[0-9A-Za-z.+-]+$ ]]
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]]

          object="$(gh api --method GET \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$repository/git/ref/tags/$tag")"
          object_type="$(jq -er '.object.type | select(type == "string")' <<<"$object")"
          object_sha="$(jq -er '.object.sha | select(type == "string")' <<<"$object")"
          seen=":"
          depth=0
          while [[ "$object_type" == "tag" ]]; do
            [[ "$object_sha" =~ ^[0-9a-f]{40}$ ]]
            [[ "$seen" != *":$object_sha:"* ]]
            seen+="$object_sha:"
            (( depth += 1 ))
            (( depth <= 16 ))
            object="$(gh api --method GET \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/$repository/git/tags/$object_sha")"
            object_type="$(jq -er '.object.type | select(type == "string")' <<<"$object")"
            object_sha="$(jq -er '.object.sha | select(type == "string")' <<<"$object")"
          done
          [[ "$object_type" == "commit" && "$object_sha" == "$expected" ]]

          existing="$(
            gh api --method GET --paginate \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/$repository/releases?per_page=100" \
              --jq '.[].tag_name'
          )"
          ! grep -Fxq -- "$tag" <<<"$existing"

          release_flags=(
            --repo "${GITHUB_REPOSITORY}"
            --draft
            --verify-tag
            --title "${GITHUB_REF_NAME}"
            --notes-file final-release/release_body.md
          )
          if [[ "${{ needs.quality-gate.outputs.is_prerelease }}" == "true" ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" final-release/assets/* "${release_flags[@]}"
