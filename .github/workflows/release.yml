          ) or state_total != state_opened.st_size:
              raise SystemExit('Final snapshot state changed while hashing')
          output_path = os.environ.get('GITHUB_OUTPUT', '')
          if not output_path:
              raise SystemExit('GITHUB_OUTPUT is required for final snapshot binding')
          output_descriptor = os.open(
              output_path,
              os.O_WRONLY | os.O_APPEND | getattr(os, 'O_NOFOLLOW', 0),
          )
          try:
              write_all(
