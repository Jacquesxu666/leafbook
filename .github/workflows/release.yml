                  after = os.fstat(descriptor)
              finally:
                  os.close(descriptor)
              final = os.lstat(item_path)
              identity = [
                  opened.st_dev, opened.st_ino, opened.st_mode, opened.st_nlink,
                  opened.st_size, opened.st_mtime_ns, opened.st_ctime_ns,
              ]
              if identity != [
                  before.st_dev, before.st_ino, before.st_mode, before.st_nlink,
                  before.st_size, before.st_mtime_ns, before.st_ctime_ns,
              ] or identity != [
                  after.st_dev, after.st_ino, after.st_mode, after.st_nlink,
                  after.st_size, after.st_mtime_ns, after.st_ctime_ns,
              ] or identity != [
                  final.st_dev, final.st_ino, final.st_mode, final.st_nlink,
                  final.st_size, final.st_mtime_ns, final.st_ctime_ns,
              ] or total != opened.st_size:
                  raise SystemExit('Final snapshot file changed: ' + relative)
              return {'path': relative, 'sha256': digest.hexdigest(), 'identity': identity}

          os.chmod(snapshot_evidence, 0o500)
          os.chmod(snapshot_root, 0o500)
          directories = []
          for relative in ['', 'assets', 'evidence']:
              directory_path = os.path.join(snapshot_root, relative)
              directory = os.lstat(directory_path)
              if not stat.S_ISDIR(directory.st_mode) or stat.S_ISLNK(directory.st_mode):
                  raise SystemExit('Unsafe final snapshot directory: ' + relative)
              directories.append({
                  'path': relative,
                  'identity': [
                      directory.st_dev, directory.st_ino, directory.st_mode,
                      directory.st_nlink, directory.st_mtime_ns, directory.st_ctime_ns,
                  ],
                  'entries': sorted(os.listdir(directory_path), key=os.fsencode),
              })
          state = {
              'schema': 1,
              'tag': tag,
              'commit': commit,
              'nonce': secrets.token_hex(32),
              'files': [stable_record(name, file_limits[name]) for name in sorted(file_limits, key=os.fsencode)],
              'directories': directories,
          }
          state_path = 'final-release-state.json'
          state_descriptor = os.open(state_path, destination_flags, 0o400)
          try:
              write_all(state_descriptor, (json.dumps(state, sort_keys=True, separators=(',', ':')) + '\n').encode())
              os.fsync(state_descriptor)
          finally:
              os.close(state_descriptor)
