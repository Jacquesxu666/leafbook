name: Setup pnpm and Node.js
description: Install pnpm, Node.js, and project dependencies (skips postinstall scripts)

inputs:
  node-version:
    description: Node.js version to install
    required: false
    default: '22.21.1'

runs:
  using: composite
  steps:
    - name: Install pnpm
      # pnpm/action-setup v4.4.0
      uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

    - name: Install Node.js
      # actions/setup-node v4.4.0
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'pnpm'
        token: ''

    - name: Install Dependencies
      shell: bash
      run: |
        pnpm config set store-dir "$RUNNER_TEMP/leafbook-pnpm-store"
        git_hosted_store="$RUNNER_TEMP/leafbook-pnpm-store/v10/https+++codeload.github.com+file-icons+atom+tar.gz+28520868aee66e576145a0b18aa2cde5444a897a"
        rm -rf -- "$git_hosted_store"
        pnpm install --frozen-lockfile --ignore-scripts
        if [[ -f "$git_hosted_store/integrity-not-built.json" ]]; then
          cp "$git_hosted_store/integrity-not-built.json" "$git_hosted_store/integrity.json"
        fi
